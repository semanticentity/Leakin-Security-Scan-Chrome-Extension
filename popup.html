<!DOCTYPE html>
<html>
<head>
  <title>Leakin</title>
  <meta charset="UTF-8">
  <style>
    body {
      font-family: Arial, sans-serif;
      width: 350px;
      padding: 10px;
      margin: 0;
    }
    h1 {
      font-size: 18px;
      margin-bottom: 10px;
    }
    button {
      background-color: #6200EA;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      margin: 10px auto 0;
      width: 100%;
    }
    button:hover {
      background-color: #5c0ab5;
    }
    .version-info {
      font-size: 12px;
      color: #666;
      margin-top: 15px;
      text-align: right;
    }
    .tabs {
      display: flex;
      border-bottom: 1px solid #ccc;
      margin-bottom: 15px;
    }
    .tab {
      padding: 8px 16px;
      cursor: pointer;
      background-color: #f1f1f1;
      border: 1px solid #ccc;
      border-bottom: none;
      margin-right: 2px;
      border-top-left-radius: 4px;
      border-top-right-radius: 4px;
    }
    .tab.active {
      background-color: white;
      border-bottom: 1px solid white;
      margin-bottom: -1px;
      font-weight: bold;
    }
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }
    #resultsContainer {
      max-height: 300px;
      overflow-y: auto;
      border: 1px solid #eee;
      padding: 10px;
      margin-bottom: 10px;
      background-color: #f9f9f9;
    }
    .result-item {
      margin-bottom: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid #eee;
    }
    .result-item:last-child {
      border-bottom: none;
    }
    .result-label {
      font-weight: bold;
      margin-right: 5px;
    }
    .settings-group {
      margin-bottom: 15px;
    }
    .settings-group label {
      display: block;
      margin-bottom: 5px;
    }
    .settings-group input[type="checkbox"] {
      margin-right: 5px;
    }
  </style>
</head>
<body>
  <h1>Leakin</h1>
  
  <div class="tabs">
    <div class="tab active" data-tab="scan">Scan</div>
    <div class="tab" data-tab="results">Results</div>
    <div class="tab" data-tab="settings">Settings</div>
  </div>
  
  <div id="scan" class="tab-content active">
    <p>Scan web pages for exposed credentials and API keys</p>
    <button id="executeButton">Run on Current Page</button>
    <div id="scanStatus"></div>
  </div>
  
  <div id="results" class="tab-content">
    <div id="resultsContainer" style="max-height: 400px; overflow-y: auto; border: 1px solid #eee; padding: 10px; margin-bottom: 10px; background-color: #f9f9f9;">
      <p>No results yet. Run a scan to see findings here.</p>
    </div>
    <button id="clearResultsButton" style="margin-bottom: 10px; background-color: #d9534f; width: auto; padding: 5px 10px; font-size: 12px;">Clear Results</button>
  </div>
  
  <div id="settings" class="tab-content">
    <div class="settings-group">
      <label for="scanInlineScripts">
        <input type="checkbox" id="scanInlineScripts" name="scanInlineScripts">
        Scan inline scripts (&lt;script&gt;...&lt;/script&gt;)
      </label>
    </div>
    <div class="settings-group">
      <label for="scanExternalScripts">
        <input type="checkbox" id="scanExternalScripts" name="scanExternalScripts">
        Scan same-origin external scripts (&lt;script src="..."&gt;)
      </label>
    </div>
    <div class="settings-group">
      <label for="scanWindowObjects">
        <input type="checkbox" id="scanWindowObjects" name="scanWindowObjects">
        Scan window object properties (window...)
      </label>
    </div>
    <div class="settings-group">
      <label for="showPopupOnScan">
        <input type="checkbox" id="showPopupOnScan" name="showPopupOnScan">
        Show results popup on page after scan completes
      </label>
    </div>
     <p style="font-size: 12px; color: #666; margin-top: 20px;">
      Settings are saved automatically.
    </p>
  </div>
  
  <div class="version-info" id="versionDisplay">
    Loading version...
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
